# שם התהליך
name: Create Release

# מתי להריץ? רק כשדוחפים תגית שמתחילה ב-v
on:
  push:
    tags:
      - 'v*' # מפעיל על כל תגית שמתחילה ב-'v', למשל v1.0, v2.1-beta

jobs:
  # --- ג'וב לבניית גרסת ווינדוס ---
  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Get Flutter dependencies
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - name: Archive Windows build
        # נארוז את כל התיקייה לקובץ ZIP כדי שיהיה קל להוריד
        run: Compress-Archive -Path build/windows/x64/runner/Release -DestinationPath windows-build.zip
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: windows-build.zip

  # --- ג'וב לבניית גרסת לינוקס ---
  build-linux:
    name: Build Linux App
    runs-on: ubuntu-latest
    steps:
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Get Flutter dependencies
        run: flutter pub get
      - name: Build Linux
        run: flutter build linux --release
      - name: Archive Linux build
        run: zip -r linux-build.zip build/linux/x64/release/bundle
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: linux-build.zip

  # --- ג'וב חדש: יצירת ה-Release ---
  create-release:
    name: Create Release
    # תלוי בהצלחה של שני הג'ובים הקודמים
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build
      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          
      # השלב החשוב: יצירת ה-Release וצירוף הקבצים
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          # השתמש בשם התגית כשם ה-Release
          tag_name: ${{ github.ref_name }}
          # סמן את זה כ-Pre-release (בטא)
          prerelease: true
          # צרף את כל קבצי ה-ZIP שהורדנו
          files: |
            windows-build.zip
            linux-build.zip