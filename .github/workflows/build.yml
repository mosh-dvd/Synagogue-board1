# שם התהליך
name: Create Release

# מתי להריץ? רק כשדוחפים תגית שמתחילה ב-v
on:
  push:
    tags:
      - 'v*'

jobs:
  # --- ג'וב לבניית גרסת ווינדוס ---
  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Get Flutter dependencies
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      
      # --- שלב חדש: התקנת Inno Setup ---
      - name: Setup Inno Setup
        uses: Amine-Smahi/setup-inno-setup@v1.0.1
      
      # --- שלב חדש: יצירת תוכנת ההתקנה ---
      - name: Create Installer
        # הרצת הקומפיילר של Inno Setup על התסריט שלנו
        run: iscc "installer/setup_script.iss"
      
      - name: Upload Installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          # Inno Setup יוצר את הפלט בתיקיית Output, כברירת מחדל
          path: installer/Output/setup.exe

  # ... (הג'וב של לינוקס נשאר ללא שינוי) ...
  build-linux:
    name: Build Linux App
    # ... (כל השלבים כמו קודם) ...
    
  create-release:
    name: Create Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: true
          # --- עדכון רשימת הקבצים לצירוף ---
          files: |
            setup.exe
            linux-build.zip