# שם התהליך
name: Create Release

# מתי להריץ? רק כשדוחפים תגית שמתחילה ב-v
on:
  push:
    tags:
      - 'v*'

# הרשאות כתיבה כדי לאפשר יצירת Release
permissions:
  contents: write

jobs:
  # --- ג'וב לבניית גרסת ווינדוס ---
  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Get Flutter dependencies
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - name: Setup Inno Setup
        uses: Minionguy/setup-inno-setup@v1
      - name: Create Installer
        run: iscc "installer/setup_script.iss"
      - name: Upload Installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/Output/setup.exe

  # --- ג'וב לבניית גרסת לינוקס ---
  build-linux:
    name: Build Linux App
    runs-on: ubuntu-latest
    steps:
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Get Flutter dependencies
        run: flutter pub get
      - name: Build Linux
        run: flutter build linux --release
      - name: Archive Linux build
        run: zip -r linux-build.zip build/linux/x64/release/bundle
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: linux-build.zip

  # --- ג'וב חדש: יצירת ה-Release ---
  create-release:
    name: Create Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: linux-build
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: true
          files: |
            setup.exe
            linux-build.zip