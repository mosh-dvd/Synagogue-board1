# שם התהליך
name: Build Flutter App

# מתי להריץ? בכל פוש לענף הראשי
on:
  push:
    branches: [ "main" ]

jobs:
  # --- ג'וב לבניית גרסת אנדרואיד ---
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      # 1. הורדת הקוד של הפרויקט
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. התקנת Java (דרוש לבניית אנדרואיד)
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'

      # 3. התקנת סביבת Flutter (השלב הכי חשוב)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable' # אפשר לבחור גם beta או dev

      # 4. הורדת כל התלויות של הפרויקט (מה-pubspec.yaml)
      - name: Get Flutter dependencies
        run: flutter pub get

      # 5. (אופציונלי) הרצת בדיקות כדי לוודא שהכל תקין
      # - name: Run Flutter tests
      #   run: flutter test

      # 6. בניית קובץ ה-APK
      - name: Build APK
        run: flutter build apk --release

      # 7. העלאת ה-APK כ-Artifact שניתן להוריד
      - name: Upload APK artifact
        uses: actions/upload-artifact@v3
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # --- ג'וב לבניית גרסת ווינדוס ---
  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v3
        with:
          name: windows-build
          path: build/windows/runner/Release

  # --- ג'וב לבניית גרסת לינוקס ---
  build-linux:
    name: Build Linux App
    runs-on: ubuntu-latest
    steps:
      # 1. התקנת תלויות מערכת שדרושות לקימפול בלינוקס
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v3
        with:
          name: linux-build
          # הנתיב לקבצים המקומפלים של לינוקס
          path: build/linux/x64/release/bundle